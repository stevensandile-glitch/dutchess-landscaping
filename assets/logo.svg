<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140">
  <!-- Background -->
  <rect width="560" height="140" fill="#1e4230" rx="8"/>

  <!-- Branch sweeping left from D -->
  <g fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round">
    <path d="M 68,68 C 52,72 36,76 16,84"/>
    <path d="M 44,72 C 36,80 28,86 20,92"/>
    <path d="M 32,74 C 26,80 20,86 16,96"/>
    <path d="M 55,70 C 45,76 34,86 28,96"/>
  </g>

  <!-- Dutchess main text -->
  <text x="62" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#ffffff" font-weight="bold" letter-spacing="-1">Dutchess</text>

  <!-- .co.uk superscript -->
  <text x="428" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#ffffff" font-weight="bold">.co.uk</text>

  <!-- Two leaves upper right of the s -->
  <!-- Back leaf -->
  <ellipse cx="440" cy="34" rx="18" ry="9" fill="#ffffff" opacity="0.85" transform="rotate(-50 440 34)"/>
  <!-- Front leaf -->
  <ellipse cx="428" cy="44" rx="16" ry="8" fill="#ffffff" transform="rotate(-30 428 44)"/>
  <!-- Leaf stem -->
  <line x1="432" y1="50" x2="442" y2="30" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- plantsforlondon subtext -->
  <text x="90" y="112" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="0.5">
    <tspan fill="#a8d878" font-weight="300">plants</tspan><tspan fill="#a8d878" font-weight="700">for</tspan><tspan fill="#a8d878" font-weight="300">london</tspan>
  </text>
</svg>
